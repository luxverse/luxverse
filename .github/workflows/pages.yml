name: Pubblica la parte statica

# ============================================================
# LA PARTE STATICA DEL SITO — QUELLA CHE SI LEGGE E BASTA
# ============================================================
# Il sito e' diviso in due (vedi la nota in site/config.php):
#
#   · le pagine che hanno bisogno di dati, sessioni o calcoli — home,
#     bacheca, strumenti, spazio personale, pannello, API — restano sul
#     server, dove i dati vivono davvero;
#   · le pagine di contenuto fisso — privacy, termini, chi siamo, FAQ,
#     percorso del rilascio, linea del tempo, codice aperto, condividi — e i
#     file che le fanno funzionare (fogli di stile, script, immagini)
#     diventano HTML e vengono serviti da una rete di distribuzione.
#
# Perche': una pagina di contenuto non cambia mentre la leggi. Servirla da
# una rete significa aprirla in un attimo anche quando il server e' occupato,
# e lasciare il server libero per quello che e' davvero dinamico.
#
# Come: tools/build_static.php renderizza le pagine PHP vere, una per una e in
# italiano e in inglese, e copia i file di lavoro. Il PHP e' gia' installato
# sulla macchina che compila. Se una pagina si rompe, il flusso si ferma e
# non pubblica niente, invece di mettere online un file rotto.
# ============================================================

on:
  push:
    branches: [ main ]
    paths:
      - 'site/**'
      - 'tools/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Due pubblicazioni insieme si sovrascriverebbero a vicenda.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  genera:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il codice
        uses: actions/checkout@v4

      - name: Genera le pagine statiche
        run: php tools/build_static.php

      - name: Controlla che ci sia qualcosa da pubblicare
        run: |
          set -e
          n=$(ls -1 frontend/*.html | wc -l)
          echo "Pagine generate: $n"
          if [ "$n" -lt 8 ]; then
            echo "Troppe poche pagine: la pubblicazione non va avanti."
            exit 1
          fi
          if [ ! -f frontend/assets/css/site.css ]; then
            echo "Manca il foglio di stile: la pubblicazione non va avanti."
            exit 1
          fi

      - name: Prepara la pubblicazione
        uses: actions/configure-pages@v5

      - name: Carica i file generati
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend

  pubblica:
    needs: genera
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Pubblica
        id: deployment
        uses: actions/deploy-pages@v4
