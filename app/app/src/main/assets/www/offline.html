<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0A0B0D">
<title>L.U.X. Verse — Sei offline</title>
<style>
    :root {
        --ink: #0A0B0D;
        --panel: #15181B;
        --bone: #EDE9E0;
        --muted: #A5A197;
        --gold: #D8A93C;
        --line: rgba(237,233,224,.16);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; }
    body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 32px 24px calc(32px + env(safe-area-inset-bottom));
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
        background: radial-gradient(90% 45% at 50% -8%, #14171B 0%, var(--ink) 64%);
        color: var(--bone);
    }
    .badge {
        display: flex; align-items: center; justify-content: center;
        width: 78px; height: 78px;
        border-radius: 12px;
        border: 1px solid var(--line);
        background: var(--panel);
        color: var(--gold);
        margin-bottom: 26px;
    }
    .badge svg { width: 34px; height: 34px; }
    h1 { font-size: 1.55em; font-weight: 700; letter-spacing: -.03em; margin-bottom: 10px; }
    h1 span { color: var(--gold); }
    p { color: var(--muted); max-width: 460px; line-height: 1.7; margin-bottom: 26px; font-size: .97em; }
    button.retry {
        display: inline-flex; align-items: center; gap: 9px;
        padding: 14px 26px;
        border: 0; border-radius: 8px;
        font: inherit; font-weight: 600;
        background: var(--gold);
        color: #14100A;
        cursor: pointer;
    }
    button.retry:active { background: #F0CE86; }
    button.retry svg { width: 17px; height: 17px; }
    .state { margin-top: 18px; font-size: .82em; color: var(--muted); min-height: 1.2em; }
</style>
</head>
<body>
    <div class="badge" role="img" aria-label="L.U.X. Verse">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 6l11 8 11-8"/><path d="M1 18l7.5-7"/><path d="M23 18l-7.5-7"/><path d="M2 6h20v12H2z"/></svg>
    </div>
    <h1>Sei <span>offline</span></h1>
    <p>L.U.X. Verse non &egrave; raggiungibile in questo momento. Controlla la connessione e riprova: l'app si riapre sempre sulla versione pi&ugrave; recente del sito.</p>
    <button type="button" class="retry" id="retry">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="22 4 22 10 16 10"/><path d="M20.5 15a9 9 0 1 1-2.6-9.3L22 10"/></svg>
        <span id="retry-label">Riprova</span>
    </button>
    <div class="state" id="state"></div>

<script>
    // L'indirizzo del sito NON viene scritto qui: l'app lo passa dall'esterno
    // (un unico posto in cui e' definito) quando questa pagina termina di caricare.
    var TARGET = '';
    window.__luxRetryUrl = function (url) { TARGET = url || ''; };
    document.getElementById('retry').addEventListener('click', function () {
        var state = document.getElementById('state');
        if (!TARGET) {
            state.textContent = 'Riavvio dell\'app in corso…';
            return;
        }
        state.textContent = 'Riconnessione…';
        window.location.href = TARGET;
    });
    // Etichetta anche in inglese, se il telefono non e' italiano.
    if ((navigator.language || 'it').slice(0, 2) !== 'it') {
        document.documentElement.lang = 'en';
        document.getElementById('retry-label').textContent = 'Try again';
        document.querySelector('h1').innerHTML = 'You are <span>offline</span>';
        document.querySelector('p').textContent = 'L.U.X. Verse is not reachable right now. Check your connection and try again: the app always reopens on the latest version of the site.';
    }
</script>
</body>
</html>
